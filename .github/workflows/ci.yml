name: ci

# Build + selftest of yuki (package manager) on native targets:
#   ubuntu-latest     -> x86_64-unknown-linux-gnu (tests run)
#   ubuntu-24.04-arm  -> aarch64-unknown-linux-gnu (tests run)
# Yukino compiler is installed via cargo install from yukitsuri/yukino (main),
# LLVM 22 comes from apt.llvm.org (llvm-ar/clang needed for the runtime).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    experimental: false }
          - { os: ubuntu-24.04-arm, experimental: true }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: LLVM 22 + build deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common \
            pkg-config libffi-dev zlib1g-dev libxml2-dev libncurses-dev libzstd-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"
          /usr/lib/llvm-22/bin/llvm-ar --version | head -n 2

      - name: Cache yukino binaries
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/yukino
            ~/.cargo/bin/yukic
          key: yukino-${{ runner.os }}-${{ runner.arch }}-main

      - name: cargo install yukino + yukic-driver
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cargo install --git https://github.com/yukitsuri/yukino --branch main --locked yukino
          cargo install --git https://github.com/yukitsuri/yukino --branch main --locked yukic-driver

      - name: Versions
        run: |
          which yukino yukic llvm-ar clang ld.lld
          yukino --version || true
          yukic --version || true

      - name: Build (release)
        working-directory: yuki
        run: |
          set -o pipefail
          yukino build release 2>&1 | tee /tmp/build.log

      - name: Selftest
        working-directory: yuki
        run: |
          set -o pipefail
          ./target/release/yuki selftest 2>&1 | tee /tmp/selftest.log

      - name: First compiler errors
        if: failure()
        run: |
          echo "=== build.log ==="
          grep -n -i -m 40 "error\|E0[0-9][0-9][0-9]\|not found\|not public" /tmp/build.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yuki-${{ matrix.os }}
          path: yuki/target/release/yuki
          if-no-files-found: ignore
          retention-days: 14
