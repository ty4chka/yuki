# ty4chka/yuki -> .github/workflows/build.yml
# Две ступени: компилятор Yukino (yukitsuri/yukino, Rust + LLVM 22) -> сам yuki
# (yukino build release; профиль - ПОЗИЦИОННЫЙ аргумент, не флаг --release;
# параметры берутся из yuki.toml [config.release]).
# Проект лежит в подпапке yuki/ (yuki/yuki.toml) - каталог определяется автоматически.
# -> smoke: version + selftest (фатален). Тег v* -> yuki-<версия>-<таргет>.tar.zst.
#
# macOS убран из матрицы: macOS-таргет в Yukino пока в roadmap, компилятор
# поддерживает только linux (glibc/musl), windows и android.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Locate project (yuki.toml)
        shell: bash
        run: |
          set -e
          T=$(find . -maxdepth 3 -name yuki.toml -not -path './.git/*' | head -1)
          [ -n "$T" ] || { echo "yuki.toml не найден"; exit 1; }
          D=$(dirname "$T")
          echo "PROJ_DIR=$D" >> "$GITHUB_ENV"
          echo "Проект: $D"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo -E bash -s -- 22
          sudo apt-get install -y libpolly-22-dev lld-22
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Stage 1 - Yukino compiler
        run: |
          git clone --depth 1 https://github.com/yukitsuri/yukino "$RUNNER_TEMP/yukino"
          cd "$RUNNER_TEMP/yukino"
          YUKINO_RELEASEBUILD=1 cargo build --release --bin yukic --bin yukino
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Stage 2 - build yuki
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJ_DIR"
          # известный недетерминированный паник кодогена (sitofp) - ретраим
          # только при панике; обычные ошибки компиляции падают сразу
          ok=0
          for i in 1 2 3 4 5; do
            echo "::group::yukino build release (попытка $i)"
            if yukino build release 2>&1 | tee build.log; then ok=1; echo "::endgroup::"; break; fi
            echo "::endgroup::"
            grep -qi 'panicked' build.log || { echo "Ошибка компиляции (не паник) - ретрай не нужен"; break; }
          done
          [ "$ok" = "1" ] || { echo "yukino build release failed"; exit 1; }

      - name: Errors summary (только при падении)
        if: failure()
        shell: bash
        run: |
          cd "$PROJ_DIR" || exit 0
          [ -f build.log ] || { echo "build.log нет"; exit 0; }
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g; s/\r/\n/g' build.log > clean.log
          {
            echo '### Ошибки yukino build release'
            echo '```'
            grep -n -i -E 'error|ошибк' -A4 clean.log | head -150
            echo '```'
            echo '### Хвост лога'
            echo '```'
            tail -60 clean.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build.log (при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: |
            ${{ env.PROJ_DIR }}/build.log
            ${{ env.PROJ_DIR }}/clean.log
          if-no-files-found: ignore

      - name: Smoke - version + selftest
        timeout-minutes: 8
        shell: bash
        run: |
          set -u
          # release-бинарь зовётся yuki, debug - yuki_debug (namedbg); ловим оба
          BIN=$(find "$PROJ_DIR/yuki-work" -type f \( -name yuki -o -name yuki_debug \) | head -1)
          [ -n "$BIN" ] || { echo "бинарь не найден под $PROJ_DIR/yuki-work/"; exit 1; }
          chmod +x "$BIN"
          # без stdin и с таймаутом: зависание станет кодом 124, а не 20 минутами тишины
          echo "== version =="
          timeout 20 "$BIN" version < /dev/null 2>&1; rc=$?
          echo "version exit code: $rc"
          if [ "$rc" != "0" ]; then
            echo "::group::диагностика зависания"
            sudo apt-get install -y -qq strace > /dev/null 2>&1 || true
            echo "-- без темы (YUKI_THEME_READY=1 YUKI_ASCII=1) --"
            YUKI_THEME_READY=1 YUKI_ASCII=1 timeout 20 "$BIN" version < /dev/null 2>&1; echo "exit: $?"
            echo "-- help --"
            timeout 20 "$BIN" help < /dev/null 2>&1 | head -5; echo "exit: ${PIPESTATUS[0]}"
            echo "-- strace (последние 40 системных вызовов) --"
            timeout 20 strace -f -tt -o /tmp/strace.txt "$BIN" version < /dev/null > /dev/null 2>&1 || true
            wc -l /tmp/strace.txt || true
            tail -40 /tmp/strace.txt || true
            echo "::endgroup::"
            exit 1
          fi
          echo "== selftest =="
          timeout 90 "$BIN" selftest < /dev/null 2>&1; rc=$?
          echo "selftest exit code: $rc (124 = завис)"
          [ "$rc" = "0" ] || exit 1

      - name: Pack
        shell: bash
        run: |
          set -e
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          BIN=$(find "$PROJ_DIR/yuki-work" -type f \( -name yuki -o -name yuki_debug \) | head -1)
          mkdir -p stage dist
          cp "$BIN" stage/yuki
          tar -C stage -cf - . | zstd -q -o "dist/yuki-${{ matrix.target }}.tar.zst"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: yuki-${{ matrix.target }}
          path: dist/*.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Rename with version
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          cd dist
          for f in yuki-*.tar.zst; do mv "$f" "yuki-$V-${f#yuki-}"; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.zst
          generate_release_notes: true
          
