[bin]
name = "yuki"
namedbg = "yuki_debug"
version = "0.1.0"
entry = "src/main.ykn"
yukino = ["0.1.0", "+"] # [min, max]

# unwind обязателен: yuki ловит ошибки через sus/catch, при abort они не ловятся
[config.release]
inline_statics = true
strip_unused = true
opt_level = 3
lto = true
debug_assertions = false
panic_strategy = "unwind"
strip = true
# cpu = "native" намеренно нет: бинарник раздаётся другим людям
reloc_model = "pic"
code_model = "default"
fast_math = false
emit = ["bin"]

[features]
default = []
